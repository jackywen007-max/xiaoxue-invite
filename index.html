1510}.row{display:grid;grid-template-columns:42px minmax(0,1fr);column-gap:14px;padding:15px 0}.row .tile{position:absolute;top:0;left:-56px}.row dt,.row dd{grid-column:2}.row dt{position:relative}.row+.row{border-top:1px solid #ded6ca}.tile{display:grid;place-items:center;width:42px;height:42px;flex:none;background:#332d25;color:#fff;border-radius:13px}.label{font-size:13px;color:var(--muted);margin-bottom:2px}.value{font-size:17px}.sub{display:block;color:var(--muted)}.next{display:inline-flex;gap:7px;align-items:center;min-height:44px;margin-top:14px;color:var(--accent);font-size:15px;text-decoration:none;}.next .icon{width:16px}.notes{background:#f9f6ef}.gift-heading{color:var(--muted);margin-bottom:13px}.gift-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;list-style:none;padding:0;margin:0}.gift-grid li{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;text-align:center;font-size:12px}.gift-grid .icon{color:#332d25;width:clamp(40px,11vw,58px);height:clamp(40px,11vw,58px);stroke-width:1.25}.toast{margin-top:34px;font-size:clamp(27px,6vw,43px);letter-spacing:-.04em}.pager{--tab-width:57px;--active-tab:0;position:fixed;z-index:2;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;background:#fffcf5ed;border:1px solid #ded6ca;border-radius:100px;padding:2px;box-shadow:0 4px 20px #30251618}.pager::before{content:"";position:absolute;inset:2px auto 2px 2px;width:var(--tab-width);border-radius:100px;background:#332d25;transform:translateX(calc(var(--active-tab) * var(--tab-width)));transition:transform 440ms cubic-bezier(.24,.82,.32,1.12);pointer-events:none}.pager a{position:relative;font-size:13px;text-decoration:none;border-radius:100px;width:var(--tab-width);min-height:44px;display:grid;place-items:center;color:#544a3f;transition:color 180ms ease}.pager a[aria-current=true]{color:white}.sprite{position:absolute;width:0;height:0;overflow:hidden}@media(max-width:350px){.sc .flame path{transform-box:view-box;transform-origin:50% 86%}
@media(prefers-reduced-motion:no-preference){
  .flame-outer{animation:flame-sway 1.9s ease-in-out infinite}
  .flame-inner{animation:flame-glow 1.3s ease-in-out infinite}
}
@keyframes flame-sway{
  0%,100%{transform:skewX(-3deg) scaleY(.96)}
  30%{transform:skewX(4deg) scaleY(1.05)}
  62%{transform:skewX(-5deg) scaleY(.93)}
  82%{transform:skewX(2deg) scaleY(1.01)}
}
@keyframes flame-glow{
  0%,100%{transform:scale(.91,.87);opacity:.75}
  50%{transform:scale(1.03,1.12);opacity:1}
}
.detail-link{display:block;width:fit-content;color:inherit;text-decoration:underline;text-decoration-color:#a79a88;text-underline-offset:.2em}.detail-link:hover{color:var(--accent)}

<script>
const pager = document.querySelector('.pager');
const links = [...pager.querySelectorAll('a')];
const sections = links.map(link => document.querySelector(link.hash));
let pendingSection = null;
let pendingTimer;

function selectSection(section) {
  pager.style.setProperty('--active-tab', sections.indexOf(section));
  for (const link of links) {
    if (link.hash === '#' + section.id) link.setAttribute('aria-current', 'true');
    else link.removeAttribute('aria-current');
  }
}

function clearPendingSection() {
  pendingSection = null;
  clearTimeout(pendingTimer);
}

if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      if (pendingSection && entry.target !== pendingSection) continue;
      clearPendingSection();
      selectSection(entry.target);
    }
  }, { rootMargin: '-45% 0px -45% 0px' });
  sections.forEach(section => observer.observe(section));

  links.forEach((link, index) => {
    link.addEventListener('click', () => {
      clearPendingSection();
      pendingSection = sections[index];
      selectSection(pendingSection);
      pendingTimer = setTimeout(() => {
        clearPendingSection();
        const current = document.elementFromPoint(innerWidth / 2, innerHeight / 2)?.closest('.screen');
        if (current) selectSection(current);
      }, 1000);
    });
  });
  window.addEventListener('wheel', clearPendingSection, { passive: true });
  window.addEventListener('touchmove', clearPendingSection, { passive: true });
}
</script>
